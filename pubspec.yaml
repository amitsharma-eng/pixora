name: pixora
description: Modern cache-first network images for Flutter with memory and disk caching, retries, placeholders, and prefetching.
version: 0.1.0
repository: https://github.com/your-org/pixora

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  path_provider: ^2.1.5
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.2
